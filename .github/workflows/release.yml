name: Build and release MAKCU

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests pyserial aiohttp tenacity ping3 customtkinter Pillow colorama pywin32

      - name: Build Windows executable
        shell: pwsh
        run: |
          '{"version":"build-${{ github.run_number }}"}' | Set-Content -Path build_version.json -Encoding utf8
          python -m PyInstaller --onefile --noconsole --uac-admin --name MAKCU --add-data "assets;assets" --add-data "build_version.json;." --collect-submodules win32com main.py
          if (-not (Test-Path 'dist/MAKCU.exe')) { throw 'Build did not produce MAKCU.exe' }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mainSha = gh api "repos/${{ github.repository }}/commits/main" --jq '.sha'
          $latestFlag = if ($mainSha -eq '${{ github.sha }}') { '--latest' } else { '--latest=false' }
          gh release create "build-${{ github.run_number }}" 'dist/MAKCU.exe' --target "${{ github.sha }}" --title "MAKCU build ${{ github.run_number }}" --notes "Built from commit ${{ github.sha }}." $latestFlag
